name: Kickbase -> Google Sheets + Website

on:
  schedule:
    # Alle 5 min in den typischen Bundesliga-Fenstern (UTC, deckt Sommer- und Winterzeit ab).
    # Ob wirklich abgerufen wird, entscheidet kickoff_gate.py anhand der Anstoßzeiten.
    - cron: "*/5 18-21 * * 5"     # Fr  20:30-Spiel
    - cron: "*/5 13-20 * * 6"     # Sa  15:30 + 18:30
    - cron: "*/5 13-21 * * 0"     # So  15:30 / 17:30 / 19:30
    - cron: "*/5 16-21 * * 2,3"   # Di/Mi englische Wochen
    # Täglich 06:00 UTC: Nachlauf für Punktekorrekturen (nur wenn in den letzten 36 h gespielt wurde)
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths: ["site/**"]            # Website-Änderungen sofort veröffentlichen
  workflow_dispatch:
    inputs:
      days:
        description: "Spieltage für Aufstellungen, z. B. '1 2 3 4' (leer = automatisch)"
        required: false
        default: ""
      auto:
        description: "Wie ein geplanter Lauf behandeln (für externen Taktgeber, z. B. cron-job.org)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kickbase
  cancel-in-progress: false

jobs:
  # Entscheidet ohne Kickbase-Request, ob und wie abgerufen wird:
  #   live = Spiel läuft -> Abruf nur der Aufstellungen + Live-Punkte
  #   full = täglicher Nachlauf / manuell / Push -> 1 kompletter Abruf
  #   skip = nichts zu tun
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Kickoff-Gate (OpenLigaDB)
        id: gate
        env:
          DAILY: ${{ github.event.schedule == '0 6 * * *' }}
        run: |
          if [ "$DAILY" = "true" ]; then python kickoff_gate.py --daily; else python kickoff_gate.py; fi
      - name: Modus festlegen
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          AUTO: ${{ github.event.inputs.auto }}
          DAILY: ${{ github.event.schedule == '0 6 * * *' }}
          RUN: ${{ steps.gate.outputs.run }}
        run: |
          # externer Taktgeber (auto=true) zählt wie ein geplanter Lauf
          if [ "$AUTO" = "true" ]; then EVENT=schedule; fi
          if [ "$EVENT" != "schedule" ]; then MODE=full
          elif [ "$RUN" != "true" ]; then MODE=skip
          elif [ "$DAILY" = "true" ]; then MODE=full
          else MODE=live; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Modus: $MODE"

  update:
    needs: gate
    if: needs.gate.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Positions-Cache laden
        uses: actions/cache/restore@v4
        with:
          path: positions_cache.json
          key: positions-${{ github.run_id }}
          restore-keys: positions-

      - name: Kickbase abrufen, Sheet + data.json schreiben
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASSWORD: ${{ secrets.KICKBASE_PASSWORD }}
          KICKBASE_LEAGUE: ${{ secrets.KICKBASE_LEAGUE }}
          KICKBASE_SHEET: ${{ secrets.KICKBASE_SHEET }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          DAYS: ${{ github.event.inputs.days }}
          MODE: ${{ needs.gate.outputs.mode }}
        run: |
          printf '%s' "$GOOGLE_SA_JSON" > service_account.json
          OPTS="--site site"
          # live: nur Aufstellungen + Live-Punkte; full: zusätzlich Gesamt/Spieltage im Sheet
          if [ "$MODE" = "live" ]; then OPTS="$OPTS --lineups-only"; fi
          if [ -n "$DAYS" ]; then OPTS="$OPTS --days $DAYS"; fi
          python kickbase_fetch.py $OPTS
          rm -f service_account.json

      - name: Positions-Cache speichern
        uses: actions/cache/save@v4
        with:
          path: positions_cache.json
          key: positions-${{ github.run_id }}

      - name: Website-Paket erstellen
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Website veröffentlichen
        id: deploy
        uses: actions/deploy-pages@v4
